<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MILKRUN network map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#14150F; }
  #map { position:absolute; inset:0; background:#14150F; }
  .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(0.86) contrast(1.05) sepia(0.35) hue-rotate(160deg); }
  .leaflet-container { background:#14150F; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .leaflet-control-attribution { background:rgba(20,21,15,0.75); color:rgba(242,239,233,0.5); font-size:10px; }
  .leaflet-control-attribution a { color:rgba(242,239,233,0.7); }
  .mr-label { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;
              color:#F2EFE9; white-space:nowrap; text-shadow:0 1px 3px #000, 0 0 10px #000; }
  .mr-label.hub { font-size:12px; font-weight:500; color:#F2EFE9; }
  .mr-dot { width:9px; height:9px; flex:0 0 auto; box-sizing:border-box; border-radius:50%; background:#C9D4D2; box-shadow:0 0 0 3px rgba(20,21,15,0.85); }
  .mr-dot.hub { width:17px; height:17px; background:transparent; border:4px solid var(--accent, #E2571E); box-shadow:0 0 0 3px rgba(20,21,15,0.85), 0 0 18px rgba(226,87,30,0.7); }
  .leaflet-control-zoom a { background:#1C1E18; color:#F2EFE9; border-color:rgba(242,239,233,0.2); }
  .leaflet-control-zoom a:hover { background:#E2571E; color:#14150F; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const accent = new URLSearchParams(location.search).get('accent') || '#E2571E';
  document.documentElement.style.setProperty('--accent', accent);

  const HUB = { name: "Mount Currie", sub: "Base", lat: 50.3167, lng: -122.6833, hub: true };
  const SITES = [
    { name: "Pemberton", lat: 50.3200, lng: -122.8028, min: 6, left: true, dy: -16 },
    { name: "N'Quatqua", lat: 50.5667, lng: -122.4833, min: 12 },
    { name: "Samahquam", lat: 49.9833, lng: -122.3333, min: 16, left: true },
    { name: "Skatin", lat: 49.9167, lng: -122.3667, min: 19 },
    { name: "Port Douglas", lat: 49.7708, lng: -122.1642, min: 27, left: true }
  ];

  const map = L.map('map', {
    scrollWheelZoom: false,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 15
  }).addTo(map);

  const pin = (s) => {
    const label = '<div class="mr-label' + (s.hub ? ' hub' : '') + '">' + s.name +
          (s.min ? ' <span style="opacity:.55">' + s.min + ' min</span>' : '') +
          (s.sub ? ' <span style="color:' + accent + '">' + s.sub + '</span>' : '') + '</div>';
    const dot = '<div class="mr-dot' + (s.hub ? ' hub' : '') + '"></div>';
    const icon = L.divIcon({
      className: '',
      html: '<div style="position:relative;width:0;height:0">' +
            '<div style="position:absolute;top:' + (s.dy || 0) + 'px;' +
            (s.left ? 'right:-4px;flex-direction:row-reverse;' : 'left:-4px;') +
            'transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;width:max-content;">' +
            dot + label + '</div></div>',
      iconSize: [0, 0]
    });
    L.marker([s.lat, s.lng], { icon, keyboard: false }).addTo(map);
  };

  SITES.forEach(pin);
  pin(HUB);

  map.fitBounds(L.latLngBounds([HUB, ...SITES].map((s) => [s.lat, s.lng])), {
    paddingTopLeft: [110, 56],
    paddingBottomRight: [110, 56]
  });
</script>
</body>
</html>
