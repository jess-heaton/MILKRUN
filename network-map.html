<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MILKRUN candidate service area</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#14150F; }
  #map { position:absolute; inset:0; background:#14150F; }
  .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(0.86) contrast(1.05) sepia(0.35) hue-rotate(160deg); }
  .leaflet-container { background:#14150F; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .leaflet-control-attribution { background:rgba(20,21,15,0.75); color:rgba(242,239,233,0.5); font-size:10px; }
  .leaflet-control-attribution a { color:rgba(242,239,233,0.7); }
  .mr-label { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;
              color:#F2EFE9; white-space:nowrap; text-shadow:0 1px 3px #000, 0 0 10px #000; }
  .mr-label.origin { font-size:12px; font-weight:500; color:#F2EFE9; }
  .mr-dot { width:9px; height:9px; flex:0 0 auto; box-sizing:border-box; border-radius:50%; background:var(--accent, #E2571E); box-shadow:0 0 0 3px rgba(20,21,15,0.85), 0 0 10px rgba(226,87,30,0.55); }
  .mr-dot.origin { width:17px; height:17px; background:transparent; border:4px solid var(--accent, #E2571E); box-shadow:0 0 0 3px rgba(20,21,15,0.85), 0 0 18px rgba(226,87,30,0.7); }
  .leaflet-control-zoom a { background:#1C1E18; color:#F2EFE9; border-color:rgba(242,239,233,0.2); }
  .leaflet-control-zoom a:hover { background:#E2571E; color:#14150F; }
  /* clear the caption band the parent page overlays across the top */
  .leaflet-top.leaflet-left .leaflet-control-zoom { margin-top:48px; }

  .mr-legend { background:rgba(20,21,15,0.78); border:1px solid rgba(242,239,233,0.16); padding:9px 12px; margin:0 0 12px 12px;
               font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase;
               color:rgba(242,239,233,0.72); display:flex; flex-direction:column; gap:7px; }
  .mr-legend div { display:flex; align-items:center; gap:9px; }
  .mr-legend .swatch-line { width:26px; height:0; border-top:1.5px dashed var(--accent, #E2571E); opacity:0.85; }
  .mr-legend .swatch-dot { width:8px; height:8px; border-radius:50%; background:var(--accent, #E2571E); }

  @media (max-width: 520px) {
    .mr-label { font-size:9.5px; letter-spacing:0.06em; }
    .mr-label.origin { font-size:10.5px; }
    .mr-dot { width:8px; height:8px; }
    .mr-dot.origin { width:15px; height:15px; border-width:3.5px; }
    .leaflet-control-attribution { font-size:8px; }
    .mr-legend { font-size:8px; padding:7px 9px; gap:5px; margin:0 0 10px 10px; }
    .mr-legend .swatch-line { width:18px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const accent = new URLSearchParams(location.search).get('accent') || '#E2571E';
  document.documentElement.style.setProperty('--accent', accent);

  // The origin area is the Pemberton / Mount Currie side of the valley; the exact
  // launch site has not been chosen, so both are drawn as origin markers.
  const ORIGIN = [
    { name: "Pemberton", sub: "Origin area", lat: 50.3200, lng: -122.8028, origin: true, left: true, dy: -16 },
    { name: "Mount Currie", lat: 50.3167, lng: -122.6833, origin: true }
  ];
  const SITES = [
    { name: "N'Quatqua", lat: 50.5667, lng: -122.4833 },
    { name: "Samahquam", lat: 49.9833, lng: -122.3333, left: true },
    { name: "Skatin", lat: 49.9167, lng: -122.3667 },
    { name: "Xa'xtsa", lat: 49.7708, lng: -122.1642, left: true }
  ];

  const map = L.map('map', {
    scrollWheelZoom: false,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 15
  }).addTo(map);

  // Indicative corridors only — nothing here is a surveyed or approved route.
  const from = [ORIGIN[0].lat, ORIGIN[0].lng];
  SITES.forEach((s) => {
    L.polyline([from, [s.lat, s.lng]], {
      color: accent, weight: 1.2, opacity: 0.5, dashArray: '3 8', interactive: false
    }).addTo(map);
  });

  const pin = (s) => {
    const label = '<div class="mr-label' + (s.origin ? ' origin' : '') + '">' + s.name +
          (s.sub ? ' <span style="color:' + accent + '">' + s.sub + '</span>' : '') + '</div>';
    const dot = '<div class="mr-dot' + (s.origin ? ' origin' : '') + '"></div>';
    const icon = L.divIcon({
      className: '',
      html: '<div style="position:relative;width:0;height:0">' +
            '<div style="position:absolute;top:' + (s.dy || 0) + 'px;' +
            (s.left ? 'right:-4px;flex-direction:row-reverse;' : 'left:-4px;') +
            'transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;width:max-content;">' +
            dot + label + '</div></div>',
      iconSize: [0, 0]
    });
    L.marker([s.lat, s.lng], { icon, keyboard: false }).addTo(map);
  };

  SITES.forEach(pin);
  ORIGIN.forEach(pin);

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const el = L.DomUtil.create('div', 'mr-legend');
    el.innerHTML =
      '<div><span class="swatch-dot"></span>Candidate service area</div>' +
      '<div><span class="swatch-line"></span>Indicative corridor · not operational</div>';
    return el;
  };
  legend.addTo(map);

  // Label gutters have to shrink with the frame, or a phone-width map zooms
  // out until the valley is a smudge.
  const bounds = L.latLngBounds([...ORIGIN, ...SITES].map((s) => [s.lat, s.lng]));
  const fit = () => {
    const w = map.getSize().x;
    const padX = Math.max(34, Math.min(110, Math.round(w * 0.22)));
    const padY = Math.max(28, Math.min(56, Math.round(map.getSize().y * 0.09)));
    map.fitBounds(bounds, { paddingTopLeft: [padX, padY], paddingBottomRight: [padX, padY] });
  };
  fit();
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 200); });
</script>
</body>
</html>
